<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>EC Image Page - Landscape Letter</title>
<style>

@page { size: Letter landscape; margin: 0.75in; }
html, body { margin:0; padding:0; }
body {
  font-family: Arial, Helvetica, sans-serif;
  color:#111111;
  background:#ffffff;
  font-size:12pt;
  line-height:1.45;
}
.page {
  width:100%;
  min-height:6.82in;
  position:relative;
  background:#ffffff;
}
.header, .footer {
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}
.header td, .footer td { padding:0; vertical-align:top; }
.header-left { width:72%; line-height:0; }
.header-right { width:28%; text-align:right; line-height:0; }
.header-logo { width:220px; height:auto; }
.header-corner { width:95px; height:auto; }
.site {
  font-size:6.5pt;
  color:#666666;
  text-transform:uppercase;
  letter-spacing:.25pt;
}
.page-title {
  font-size:28pt;
  line-height:1.05;
  font-weight:normal;
  margin:.32in 0 .10in 0;
}
.page-subtitle {
  font-size:11pt;
  color:#555555;
  margin:0 0 .24in 0;
  line-height:1.45;
}
.eyebrow {
  font-size:7pt;
  font-weight:bold;
  text-transform:uppercase;
  letter-spacing:.5pt;
  margin-bottom:.06in;
}
.footer {
  margin-top:.25in;
  border-top:.75pt solid #9a9a9a;
}
.footer td {
  padding-top:.08in;
  font-size:6pt;
  color:#686868;
  text-transform:uppercase;
}
.footer-left { width:50%; text-align:left; }
.footer-right { width:50%; text-align:right; }


.image-layout{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:.16in}
.image-layout td{padding:0;vertical-align:top}
.image-column{width:68%;padding-right:.18in!important}
.copy-column{width:32%;padding-left:.18in!important}
.image-frame{width:100%;height:4.40in;border:.75pt solid #d1d1d1;background:#f5f5f5;text-align:center;vertical-align:middle;overflow:hidden}
.image-frame img{max-width:100%;max-height:4.25in}
.copy-panel{background:#0a0a0a;color:#fff;min-height:3.96in;padding:.22in}
.copy-title{font-size:15pt;font-weight:bold;margin-bottom:.12in}
.copy-text{font-size:10.5pt;line-height:1.5}

</style>
</head>
<body>

<div class="page">
<table class="header"><tr>
  <td class="header-left"><span class="site">EVOLVING-CONSULTING.COM</span></td>
</tr></table>

<h1 class="page-title">IMAGE <strong>PAGE</strong></h1>
<p class="page-subtitle">Use a direct image URL with explicit dimensions for reliable PDF rendering.</p>
<table class="image-layout"><tr>
<td class="image-column">
  <table class="image-frame"><tr><td>
    <img src="https://ec-website.mnava.workers.dev/email-signature/icon-cube-teal.png" alt="EC Cube or replace with document image URL" style="width:520px;height:auto;" />
  </td></tr></table>
</td>
<td class="copy-column">
  <div class="copy-panel">
    <div class="eyebrow">IMAGE CONTEXT</div>
    <div class="copy-title">Supporting Title</div>
    <div class="copy-text">Use this panel to explain the screenshot, diagram, workflow, sample, or supporting visual. Replace the image URL when needed.</div>
  </div>
</td>
</tr></table>
</div>

</body>
</html>
