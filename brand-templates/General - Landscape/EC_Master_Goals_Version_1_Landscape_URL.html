<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>EC Goals Version 1 - Landscape Letter</title>
<style>

@page { size: Letter landscape; margin: 0.75in; }
html, body { margin:0; padding:0; }
body {
  font-family: Arial, Helvetica, sans-serif;
  color:#111111;
  background:#ffffff;
  font-size:12pt;
  line-height:1.45;
}
.page {
  width:100%;
  min-height:6.82in;
  position:relative;
  background:#ffffff;
}
.header, .footer {
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}
.header td, .footer td { padding:0; vertical-align:top; }
.header-left { width:72%; line-height:0; }
.header-right { width:28%; text-align:right; line-height:0; }
.header-logo { width:220px; height:auto; }
.header-corner { width:95px; height:auto; }
.site {
  font-size:6.5pt;
  color:#666666;
  text-transform:uppercase;
  letter-spacing:.25pt;
}
.page-title {
  font-size:28pt;
  line-height:1.05;
  font-weight:normal;
  margin:.32in 0 .10in 0;
}
.page-subtitle {
  font-size:11pt;
  color:#555555;
  margin:0 0 .24in 0;
  line-height:1.45;
}
.eyebrow {
  font-size:7pt;
  font-weight:bold;
  text-transform:uppercase;
  letter-spacing:.5pt;
  margin-bottom:.06in;
}
.footer {
  margin-top:.25in;
  border-top:.75pt solid #9a9a9a;
}
.footer td {
  padding-top:.08in;
  font-size:6pt;
  color:#686868;
  text-transform:uppercase;
}
.footer-left { width:50%; text-align:left; }
.footer-right { width:50%; text-align:right; }


.agenda{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:.18in}
.agenda td{padding:.12in 0;border-bottom:.5pt solid #d7d7d7;vertical-align:middle}
.agenda-no{width:.58in;font-size:9pt;font-weight:bold}
.agenda-text{font-size:13pt}

</style>
</head>
<body>

<div class="page">
<table class="header"><tr>
  <td class="header-left"><span class="site">EVOLVING-CONSULTING.COM</span></td>
</tr></table>

<h1 class="page-title">GOALS OF <strong>TODAY</strong></h1>
<p class="page-subtitle">Meeting agenda and discussion topics</p>
<table class="agenda">
<tr><td class="agenda-no">01</td><td class="agenda-text">Introduction and objectives</td></tr>
<tr><td class="agenda-no">02</td><td class="agenda-text">Business requirements review</td></tr>
<tr><td class="agenda-no">03</td><td class="agenda-text">Solution walkthrough</td></tr>
<tr><td class="agenda-no">04</td><td class="agenda-text">Questions and discussion</td></tr>
<tr><td class="agenda-no">05</td><td class="agenda-text">Next steps</td></tr>
</table>
</div>

</body>
</html>
