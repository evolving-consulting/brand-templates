<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>EC Thank You Version 1 - Landscape Letter</title>
<style>

@page { size: Letter landscape; margin: 0.75in; }
html, body { margin:0; padding:0; }
body {
  font-family: Arial, Helvetica, sans-serif;
  color:#111111;
  background:#ffffff;
  font-size:12pt;
  line-height:1.45;
}
.page {
  width:100%;
  min-height:6.82in;
  position:relative;
  background:#ffffff;
}
.header, .footer {
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}
.header td, .footer td { padding:0; vertical-align:top; }
.header-left { width:72%; line-height:0; }
.header-right { width:28%; text-align:right; line-height:0; }
.header-logo { width:220px; height:auto; }
.header-corner { width:95px; height:auto; }
.site {
  font-size:6.5pt;
  color:#666666;
  text-transform:uppercase;
  letter-spacing:.25pt;
}
.page-title {
  font-size:28pt;
  line-height:1.05;
  font-weight:normal;
  margin:.32in 0 .10in 0;
}
.page-subtitle {
  font-size:11pt;
  color:#555555;
  margin:0 0 .24in 0;
  line-height:1.45;
}
.eyebrow {
  font-size:7pt;
  font-weight:bold;
  text-transform:uppercase;
  letter-spacing:.5pt;
  margin-bottom:.06in;
}
.footer {
  margin-top:.25in;
  border-top:.75pt solid #9a9a9a;
}
.footer td {
  padding-top:.08in;
  font-size:6pt;
  color:#686868;
  text-transform:uppercase;
}
.footer-left { width:50%; text-align:left; }
.footer-right { width:50%; text-align:right; }


.thank-page{width:100%;height:6.82in;position:relative;overflow:hidden}
.thank-title-block{position:absolute;left:0;top:1.58in;width:5.90in}
.thank-title{font-size:100pt;line-height:.78;font-weight:bold;letter-spacing:-3.2pt;margin:0}
.thank-contact{position:absolute;right:0;bottom:.32in}
.contact-box{width:2.90in;background:#050505;color:#fff;padding:.32in;font-size:9pt;line-height:1.55}
.contact-title{font-size:11pt;font-weight:bold;margin-bottom:.18in}
.contact-label{font-size:7pt;color:#ccc;text-transform:uppercase;letter-spacing:.35pt;margin-top:.14in}

</style>
</head>
<body>

<div class="thank-page">
  <table class="header"><tr>
    <td class="header-left"><img src="https://ec-website.mnava.workers.dev/email-signature/logo-lockup.png" alt="EC Logo" style="width:220px;height:auto;" /></td>
  </tr></table>
  <div class="thank-title-block"><div class="thank-title">THANK<br/>YOU</div></div>
  <div class="thank-contact"><div class="contact-box">
    <div class="contact-title">Evolving Consulting</div>
    <div class="contact-label">Team</div>Delivery Team
    <div class="contact-label">Email</div>contact@evolving-consulting.com
    <div class="contact-label">Website</div>evolving-consulting.com
    <div class="contact-label">Address</div>1 Hunter St E, Ground Floor<br/>Hamilton, Ontario, Canada
  </div></div>
</div>

</body>
</html>
